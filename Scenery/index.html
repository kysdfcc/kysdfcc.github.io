.photo-gallery figure {

  cursor: pointer;

}
.photo-gallery figure.landscape {
  grid-row: span 1;
}
.photo-gallery figure.portrait {
  grid-row: span 2;
}
.photo-gallery a {

  height: 100%;
}
.photo-gallery img {

  height: 100%;

.photo-gallery figcaption {

  color: #fff;
  font-size: 12px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.photo-gallery figure:hover figcaption {
  opacity: 1;
}

@media (min-width: 640px) {
